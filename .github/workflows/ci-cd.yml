name: CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- CI ------
  verify:
    name: Type-check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build web bundle
        run: npm run build:web

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  # ---------------------------------------------------------------- CD ------
  deploy:
    name: Deploy (${{ github.ref_name == 'master' && 'production' || 'preview' }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Forked PRs have no access to secrets, so there is nothing to deploy with.
    if: github.event.pull_request.head.repo.fork != true

    permissions:
      contents: read
      pull-requests: write

    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # master publishes to the live domain; develop and PRs get preview URLs.
      TARGET: ${{ github.ref_name == 'master' && 'production' || 'preview' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check required secrets
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ]      || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see README > Deployment."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: Build
        run: |
          if [ "$TARGET" = production ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        run: |
          if [ "$TARGET" = production ]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed :rocket:"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Target | \`$TARGET\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| URL | $url |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const body = [
              marker,
              `🚀 **Preview deployment ready**`,
              ``,
              `${{ steps.deploy.outputs.url }}`,
              ``,
              `<sub>commit ${context.sha.slice(0, 7)}</sub>`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
