<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11143a"/>
      <stop offset="1" stop-color="#34204f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="them" cx="0.42" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#c9d6ff"/>
      <stop offset="1" stop-color="#7f9cff"/>
    </radialGradient>
    <radialGradient id="you" cx="0.58" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#ffe0c8"/>
      <stop offset="1" stop-color="#ffa878"/>
    </radialGradient>
    <clipPath id="left">
      <circle cx="98" cy="128" r="66"/>
    </clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="118" fill="url(#halo)"/>
  <circle cx="98" cy="128" r="66" fill="url(#them)"/>
  <circle cx="158" cy="128" r="66" fill="url(#you)"/>
  <!-- the overlap glows brightest -->
  <circle cx="158" cy="128" r="66" fill="#fff6e4" clip-path="url(#left)"/>
</svg>
